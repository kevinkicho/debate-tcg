<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USA Political TCG | Extreme Debate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
</head>

<body class="bg-slate-950 text-white overflow-hidden font-sans">
    <!-- LOBBY SCREEN -->
    <div id="lobby-screen"
        class="flex fixed inset-0 z-[2000] flex-col items-center justify-center bg-slate-950 text-white p-6 overflow-y-auto">
        <h1
            class="text-8xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-b from-white to-blue-500 italic tracking-tighter shadow-2xl">
            DEBATE TCG</h1>
        <p class="text-blue-400 font-bold tracking-widest uppercase mb-12 opacity-80">Campaign for the Future</p>

        <div
            class="bg-slate-900/80 p-10 rounded-3xl border-2 border-white/10 w-full max-w-md shadow-2xl backdrop-blur-xl">
            <input id="player-name" type="text" placeholder="Candidate Name"
                class="w-full p-4 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            <input id="room-id" type="text" placeholder="Debate Room ID"
                class="w-full p-4 rounded-xl bg-white/5 border border-white/10 text-white placeholder-white/30 mb-6 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            <div class="grid grid-cols-2 gap-4">
                <button id="join-btn"
                    class="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-black uppercase tracking-wider transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-blue-500/20">Join
                    Hall</button>
                <button id="join-ai-btn"
                    class="bg-emerald-600 hover:bg-emerald-500 p-4 rounded-xl font-black uppercase tracking-wider transition-all transform hover:scale-105 active:scale-95 shadow-lg shadow-emerald-500/20">Quick
                    AI Duel</button>
            </div>
            <p id="lobby-message" class="mt-6 text-center text-sm font-bold text-blue-400 hidden animate-pulse"></p>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden fixed inset-0 h-screen w-screen flex flex-col overflow-hidden bg-slate-950">
        <!-- 1. HEADER (Top Bar) - ~10vh -->
        <div id="game-header"
            class="flex-shrink-0 h-[12vh] border-b border-white/10 flex justify-between items-center px-10 bg-slate-900/50 backdrop-blur-md z-[1100]">

            <!-- Player Status -->
            <div class="flex items-center gap-4">
                <div class="bg-blue-900/40 p-3 rounded-2xl border border-blue-500/30">
                    <h2 class="text-[8px] font-black uppercase tracking-widest opacity-50 text-blue-300">My Support</h2>
                    <div class="flex items-baseline gap-1">
                        <span id="display-my-points" class="text-3xl font-black text-white">0</span>
                        <span class="text-[10px] opacity-30 text-white">/50</span>
                    </div>
                </div>
                <div id="my-buff-hub" class="flex gap-1"></div>
            </div>

            <!-- Central Gauges -->
            <div class="flex flex-col items-center gap-2">
                <div class="flex flex-col items-center gap-0.5">
                    <div class="text-[7px] font-bold uppercase tracking-tight text-red-500/60">Opponent Rebuttal</div>
                    <div class="relative w-40 h-1.5 bg-red-950 rounded-full border border-red-900/30 overflow-hidden">
                        <div id="opp-atb-gauge" class="h-full bg-red-600 w-0 transition-all duration-100"></div>
                    </div>
                </div>
                <div class="flex flex-col items-center gap-0.5">
                    <div
                        class="relative w-56 h-3 bg-blue-950 rounded-full border border-blue-900/30 p-0.5 overflow-hidden">
                        <div id="atb-gauge"
                            class="h-full bg-gradient-to-r from-blue-600 to-cyan-400 w-0 transition-all duration-100 shadow-[0_0_10px_rgba(6,182,212,0.4)]">
                        </div>
                    </div>
                    <div id="my-status" class="text-[8px] font-black uppercase text-blue-500/60 tracking-widest">Wait
                        for opening...</div>
                </div>
            </div>

            <!-- Opponent Status -->
            <div class="flex items-center gap-4 text-right">
                <div id="opp-buff-hub" class="flex gap-1"></div>
                <div class="bg-red-900/40 p-3 rounded-2xl border border-red-500/30">
                    <h2 class="text-[8px] font-black uppercase tracking-widest opacity-50 text-red-300">Opp. Support
                    </h2>
                    <div class="flex items-baseline gap-1 justify-end">
                        <span id="display-opp-points" class="text-3xl font-black text-white">0</span>
                        <span class="text-[10px] opacity-30 text-white">/50</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. THE ARENA (Middle) - ~58vh -->
        <div class="h-[58vh] flex min-h-0 overflow-hidden relative">
            <!-- Left Sidebar -->
            <div id="left-sidebar"
                class="w-64 flex-shrink-0 border-r border-white/5 p-4 flex flex-col gap-4 overflow-hidden bg-black/40">
                <h3 class="text-[10px] font-black uppercase tracking-widest text-blue-400">Pundit's Analysis</h3>
                <div id="history-log" class="flex-grow overflow-y-auto custom-scrollbar flex flex-col gap-2"></div>
            </div>

            <!-- Main Log -->
            <div id="speech-log" class="flex-grow overflow-y-auto custom-scrollbar p-8 flex flex-col gap-6 bg-black/10">
                <!-- Bubbles here -->
            </div>

            <!-- Right Sidebar -->
            <div id="right-sidebar"
                class="w-64 flex-shrink-0 border-l border-white/5 p-4 flex flex-col gap-4 overflow-y-auto custom-scrollbar bg-black/40">
                <h3 class="text-[10px] font-black uppercase tracking-widest text-red-400">Campaign Odds</h3>
                <div id="strategic-stats" class="flex flex-col gap-4">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <div class="flex justify-between text-[9px] font-bold text-white/40 mb-2">
                            <span>MOMENTUM</span>
                            <span id="momentum-val" class="text-blue-400">50%</span>
                        </div>
                        <div class="h-1 bg-slate-800 rounded-full overflow-hidden">
                            <div id="momentum-bar" class="h-full bg-blue-500 w-1/2 transition-all duration-500"></div>
                        </div>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <div class="flex justify-between text-[9px] font-bold text-white/40 mb-2">
                            <span>WIN PROBABILITY</span>
                            <span id="win-prob-val" class="text-emerald-400">50%</span>
                        </div>
                        <div id="odds-breakdown" class="flex flex-col gap-1 mt-2 text-[8px]"></div>
                    </div>
                </div>
            </div>

            <!-- Overlays (Inside Arena) -->
            <div id="draft-overlay"
                class="hidden absolute inset-0 z-[1200] bg-black/90 backdrop-blur-xl flex flex-col items-center justify-center p-10">
                <h3 id="draft-title" class="text-3xl font-black uppercase italic text-yellow-500 mb-10">DRAFT A POLICY
                </h3>
                <div id="draft-choices" class="flex gap-6 items-center justify-center transform scale-90"></div>
            </div>

            <div id="townhall-overlay"
                class="hidden absolute inset-0 z-[1300] bg-slate-950/95 backdrop-blur-2xl flex flex-col items-center justify-center p-12 text-center">
                <h2 class="text-blue-500 text-xs font-black uppercase tracking-[0.5em] mb-4">🚨 National Town Hall 🚨
                </h2>
                <h3 id="townhall-topic" class="text-4xl font-black text-white mb-6">Topic: General Policy</h3>
                <p id="townhall-question" class="text-xl text-slate-400 italic mb-10 max-w-xl"></p>
                <div class="flex gap-6">
                    <button class="bg-emerald-600 hover:bg-emerald-500 text-white px-10 py-4 rounded-2xl font-black"
                        onclick="submitVote('yes')">Support</button>
                    <button class="bg-red-600 hover:bg-red-500 text-white px-10 py-4 rounded-2xl font-black"
                        onclick="submitVote('no')">Oppose</button>
                </div>
            </div>
        </div>

        <!-- 3. PLAYER AREA (Bottom) - ~30vh -->
        <div id="player-area"
            class="flex-shrink-0 h-[30vh] bg-slate-900 border-t border-white/10 p-4 flex flex-col z-10">
            <div class="flex justify-between items-center mb-4 px-6">
                <!-- Resources -->
                <div class="flex items-center gap-8">
                    <div class="flex flex-col">
                        <div class="flex justify-between text-[10px] font-black uppercase text-yellow-500 mb-1">
                            <span>Political Capital</span>
                            <span>$<span id="display-capital">10</span>M</span>
                        </div>
                        <div class="w-48 h-2 bg-slate-950 rounded-full border border-white/5 overflow-hidden">
                            <div id="capital-gauge-fill"
                                class="h-full bg-yellow-500 w-1/3 transition-all duration-1000"></div>
                        </div>
                    </div>
                    <div id="room-id-display" class="text-[10px] font-bold text-white/20 uppercase tracking-widest">
                        HALL: #0000</div>
                </div>

                <!-- Main Actions -->
                <div class="flex gap-4">
                    <button id="draw-btn"
                        class="bg-yellow-500 hover:bg-yellow-400 text-slate-950 px-8 py-3 rounded-xl font-black uppercase tracking-tighter disabled:opacity-30 transition-all active:scale-95">
                        <span class="flex flex-col items-center">
                            <span class="text-sm">Draft Policy</span>
                            <span class="text-[8px] opacity-60">Search for Pivot</span>
                        </span>
                    </button>
                    <button id="fundraise-btn"
                        class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-3 rounded-xl font-black uppercase tracking-tighter disabled:opacity-30 transition-all active:scale-95">
                        <span class="flex flex-col items-center">
                            <span class="text-sm">Hold Rally</span>
                            <span class="text-[8px] opacity-60 text-emerald-200">Gain Capital</span>
                        </span>
                    </button>
                </div>
            </div>

            <!-- Player Hand -->
            <div id="player-hand"
                class="flex-grow flex justify-center items-center gap-4 px-10 overflow-x-auto overflow-y-visible min-h-0">
                <!-- Cards injected here -->
            </div>
        </div>
    </div>

    <!-- UTILS -->
    <div id="card-preview-tooltip" class="hidden fixed z-[9999] pointer-events-none transition-opacity duration-200">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="src/app.js"></script>
</body>

</html>
